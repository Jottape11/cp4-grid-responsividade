<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP4 - Grid Layout & Responsividade</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page-container">
    
  
    <section class="section-hero" aria-label="Apresentação e Destaque">
      <div class="hero-container">
        
        <div class="hero-area-banner">
          <img 
            src="images/banner/01.jpg" 
            alt="Vista panorâmica da vila litorânea com casas brancas tradicionais e barcos atracados na costa" 
            class="hero-img-main"
          >
        </div>

        <div class="hero-area-content">
          <p class="hero-description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla explicabo, quo, modi quod qui atque eaque repellendus est nisi voluptate facere.
          </p>
          <a href="#saiba-mais" class="btn-primary" role="button">
            Saiba mais
          </a>
        </div>

       
        <section class="hero-area-gallery" aria-label="Galeria complementar do destino">
          <div class="thumb-item">
            <img 
              src="images/banner/02.jpg" 
              alt="Mesas e cadeiras de restaurante rústico ao ar livre em viela charmosa com vista para o mar azul"
            >
          </div>
          <div class="thumb-item">
            <img 
              src="images/banner/03.jpg" 
              alt="Icônica cúpula de igreja branca e azul voltada para o oceano límpido"
            >
          </div>
          <div class="thumb-item">
            <img 
              src="images/banner/04.jpg" 
              alt="Fachada arquitetônica típica com flores vermelhas vibrantes e portão azul"
            >
          </div>
        </section>

      </div>
    </section>
