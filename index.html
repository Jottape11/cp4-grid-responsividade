<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP4 - Grid Layout & Responsividade</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="page-container">
    
    <!-- Seção 1 -->
    <section class="section-hero">
      <div class="hero-container">
        
        <div class="hero-area-banner">
          <img 
            src="images/banner/01.jpg" 
            alt="Vista panorâmica da vila litorânea com casas brancas tradicionais e barcos atracados na costa" 
            class="hero-img-main"
          >
        </div>

        <div class="hero-area-content">
          <p class="hero-description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla explicabo, quo, modi quod qui atque eaque repellendus est nisi voluptate facere.
          </p>
          <a href="#saiba-mais" class="btn-primary">
            Saiba mais
          </a>
        </div>

        <div class="hero-area-gallery">
          <div class="thumb-item">
            <img 
              src="images/banner/02.jpg" 
              alt="Mesas e cadeiras de restaurante rústico ao ar livre em viela charmosa com vista para o mar azul"
            >
          </div>
          <div class="thumb-item">
            <img 
              src="images/banner/03.jpg" 
              alt="Icônica cúpula de igreja branca e azul voltada para o oceano límpido"
            >
          </div>
          <div class="thumb-item">
            <img 
              src="images/banner/04.jpg" 
              alt="Fachada arquitetônica típica com flores vermelhas vibrantes e portão azul"
            >
          </div>
        </div>

      </div>
    </section>

    <!-- Seção 2-->
    <section class="section-gallery">
      <div class="gallery-container">
        
        <!-- Coluna 1: Linha 1 -->
        <div class="gallery-item">
          <img src="images/sea/01.jpg" alt="Formações rochosas e areia clara à beira-mar">
        </div>

        <!-- Coluna 2 -->
        <div class="gallery-item gallery-item-tall">
          <img src="images/sea/03.jpg" alt="Vista panorâmica vertical da praia paradisíaca com mar azul">
        </div>

        <!-- Coluna 3: Linha 1 -->
        <div class="gallery-item">
          <img src="images/sea/01.jpg" alt="Pedras na areia clara banhadas por águas transparentes">
        </div>

        <!-- Coluna 4 -->
        <div class="gallery-item gallery-item-tall">
          <img src="images/sea/03.jpg" alt="Costa da praia com mar límpido e areia clara">
        </div>

        <!-- Coluna 5: Linha 1 -->
        <div class="gallery-item">
          <img src="images/sea/01.jpg" alt="Costão rochoso banhado por águas transparentes">
        </div>

        <!-- Coluna 1: Linha 2 -->
        <div class="gallery-item">
          <img src="images/sea/02.jpg" alt="Caminho de areia cercado por cerca rústica de madeira">
        </div>

        <!-- Coluna 3: Linha 2 -->
        <div class="gallery-item">
          <img src="images/sea/02.jpg" alt="Faixa de areia com vegetação e mar calmo ao horizonte">
        </div>

        <!-- Coluna 5: Linha 2 -->
        <div class="gallery-item">
          <img src="images/sea/02.jpg" alt="Praia ensolarada com areia dourada e horizonte límpido">
        </div>

      </div>
    </section>

  </main>

</body>
</html>
